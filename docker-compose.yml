version: '3.8'

services:
  events-microservice:
    build: .
    container_name: events-microservice
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/src/prisma
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s